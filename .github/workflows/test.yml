name: Tests & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the default GITHUB_TOKEN (CodeQL
# actions/missing-workflow-permissions, alert #2). This workflow only checks
# out the repo and runs tests -- it writes nothing back to GitHub -- so read
# access to contents is the whole requirement. Declared at workflow level so
# any job added later inherits the restriction instead of silently taking the
# repository-default token scope.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Cloud Functions dependencies
        run: cd functions && npm ci

      - name: Run tests (React + secrets scan)
        run: npm test

      # Firestore security-rules suite (tests/rules/) against the emulator.
      # The emulator is a JVM process (firebase-tools requires Java 21+);
      # scripts/test-rules.sh runs a pinned firebase-tools via npx when the
      # CLI is not already on PATH. No secrets: it uses a demo- project id.
      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules tests (emulator)
        run: npm run test:rules

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-react
          path: coverage/react/
          retention-days: 14
